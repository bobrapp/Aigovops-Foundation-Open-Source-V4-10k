# fly.toml — deploy the AiGovOps Studio + gate service on Fly.io.
# flyctl reads this at the repo root. `fly launch --copy-config --no-deploy` then
# `fly deploy` builds ./Dockerfile in Fly's builder and serves the Studio on https.
# Public, non-production demo: no database, no secrets, no member data.
app = "aigovops-studio"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8930"
  AIGOVOPS_TIER = "1"          # zero-dependency gate/Studio in one container

[http_service]
  internal_port = 8930
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0     # scale to zero when idle (free-friendly)

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "3s"
